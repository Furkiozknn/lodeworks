name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --headless --version

      - name: Import project
        run: ./godot --headless --path . --import

      # The suite covers the balance as well as the code: if a change makes the
      # first quota unreachable or walls the curve out at stratum 20, this is
      # where it is caught, not in reviews.
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/test_runner.gd

      # The same checks the device self test runs, minus the ones that need
      # hardware. Those report UNKNOWN here and are answered by installing the
      # APK the android workflow builds.
      - name: Self test
        run: ./godot --headless --path . --script res://tools/selftest_cli.gd

      # The main screen, laid out on eleven screen shapes and three safe
      # areas: nothing overlaps, nothing leaves the safe area, every key
      # clears the 48dp floor on the phones it is enforced on, and the board
      # is fully visible between the panels. Godot can exit 0 with a script
      # error, so the verdict line is what is checked.
      - name: Landscape layout
        run: |
          timeout 300 ./godot --headless --path . tools/layout_check.tscn | tee layout-check.txt
          grep -q "=== layout check passed" layout-check.txt

      # The same corners in Turkish: longer words must not push a panel off
      # its place or over another.
      - name: Landscape layout in Turkish
        run: |
          LODEWORKS_LOCALE=tr timeout 300 ./godot --headless --path . tools/layout_check.tscn | tee layout-check-tr.txt
          grep -q "=== layout check passed" layout-check-tr.txt

      # Repo, package and estimated VRAM for every picture, and every picture
      # traced to a recorded generation. Fails over 40 MB or on an unsourced
      # file.
      - name: Art budget
        run: |
          sudo apt-get install -y -qq python3-pil
          python3 tools/asset_budget.py --md art-budget.md

      - name: Balance diagnostics
        run: ./godot --headless --path . --script res://tools/diagnose.gd

      # Scores the reference layouts against each other. It is printed rather
      # than asserted: the numbers move whenever the economy is touched, and
      # what matters is that somebody reads them when they do.
      - name: Layout scoreboard
        run: ./godot --headless --path . --script res://tools/layout_lab.gd

      # The player journey from the first tap to the long game, and whether
      # the modifier table actually changes which board is correct. Printed
      # rather than asserted for the same reason as the scoreboard -- the
      # bounds are in tests/test_gameplay.gd, the numbers behind them belong
      # in front of whoever changes the rules.
      - name: Player journey
        run: ./godot --headless --path . --script res://tools/journey_lab.gd

      - name: Strategy scoreboard
        run: ./godot --headless --path . --script res://tools/strategy_lab.gd

      # Where a player would feel value, and what paying is actually worth
      # against not paying. Printed for the same reason as the scoreboard:
      # the parity ratio is asserted in tests/test_store.gd, but the numbers
      # behind it should be in front of whoever changes the economy.
      - name: Monetization measurements
        run: ./godot --headless --path . --script res://tools/money_lab.gd

      # Regenerates store/data-safety.md from the code's own allowlists and
      # reports every Play submission requirement as done, manual or unknown.
      # The git check is the point: if the generated form no longer matches
      # the code, somebody changed what the app collects without changing what
      # the store page says it collects.
      - name: Play readiness
        run: |
          ./godot --headless --path . --script res://tools/play_readiness.gd \
            | tee play-readiness.txt
          git diff --exit-code -- store/data-safety.md

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-readiness
          path: |
            play-readiness.txt
            layout-check.txt
            art-budget.md

  screenshots:
    name: screenshots render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: ./godot --headless --path . --import
      # Rendering the store screenshots from the running game is also the only
      # automated check that the UI still draws at all. Landscape, at the
      # 1920x1080 Play asks for.
      - name: Render
        run: |
          xvfb-run -a ./godot --path . --resolution 1920x1080 \
            --rendering-driver opengl3 tools/shots.tscn
      # The four screens the visual audit compares (docs/AUDIT.md), from
      # the same build: main, zoomed, whole world, one machine close up.
      - name: Render the audit screens
        run: |
          LODEWORKS_CAPTURE=audit xvfb-run -a ./godot --path . \
            --resolution 1440x720 --rendering-driver opengl3 tools/shots.tscn \
            | tee audit.txt
          grep -q "wrote the audit screens" audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ~/.local/share/godot/app_userdata/Lodeworks/shots/
            ~/.local/share/godot/app_userdata/Lodeworks/audit/

  readability:
    name: readability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-pil
      - name: Import project
        run: ./godot --headless --path . --import

      # Renders all twelve machines at the three cell sizes a phone board
      # actually produces and fails if any two of them have become the same
      # picture -- in colour, and again desaturated. A visual pass that makes
      # the game prettier and less playable fails here rather than in a store
      # review.
      - name: Render machine strips
        run: |
          xvfb-run -a ./godot --path . --rendering-driver opengl3 \
            tools/readability.tscn
      - name: Check every machine is distinguishable
        run: |
          python3 tools/check-readability.py \
            ~/.local/share/godot/app_userdata/Lodeworks/readability

  smoke:
    name: ui smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The phone shapes, a desktop landscape window, and the two portrait
        # windows the game must still come up in without breaking.
        resolution: [1440x720, 1920x1080, 2400x1080, 1280x720, 720x1440, 360x720]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: ./godot --headless --path . --import
      # The unit tests never build a Control, so a UI that fails to
      # instantiate passes all of them. This boots the real game, opens the
      # settings panel and the device self test, and checks that what came up
      # is not a black rectangle.
      - name: Boot the game and open the self test
        run: |
          xvfb-run -a ./godot --path . --resolution ${{ matrix.resolution }} \
            --rendering-driver opengl3 tools/smoke.tscn
      # Every screen in Turkish, then in a made-up language that brackets
      # every translated word and makes it a third longer (with Larger text):
      # a bare word was written past Loc, a word too wide for its key would
      # be cut in a longer language (tools/loc_check.gd).
      - name: Every screen in Turkish and in the pseudo-language
        run: |
          LODEWORKS_LOCALE=tr xvfb-run -a ./godot --path . --resolution ${{ matrix.resolution }} \
            --rendering-driver opengl3 tools/loc_check.tscn | tee loc-tr.txt
          grep -q "=== loc check passed" loc-tr.txt
          LODEWORKS_LOCALE=pseudo LODEWORKS_LARGE=1 xvfb-run -a ./godot --path . --resolution ${{ matrix.resolution }} \
            --rendering-driver opengl3 tools/loc_check.tscn | tee loc-pseudo.txt
          grep -q "=== loc check passed" loc-pseudo.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens-${{ matrix.resolution }}
          path: ~/.local/share/godot/app_userdata/Lodeworks/smoke/
          if-no-files-found: warn
