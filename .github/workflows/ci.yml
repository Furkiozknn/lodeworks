name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --headless --version

      - name: Import project
        run: ./godot --headless --path . --import

      # The suite covers the balance as well as the code: if a change makes the
      # first quota unreachable or walls the curve out at stratum 20, this is
      # where it is caught, not in reviews.
      - name: Run tests
        run: ./godot --headless --path . --script res://tests/test_runner.gd

      # The same checks the device self test runs, minus the ones that need
      # hardware. Those report UNKNOWN here and are answered by installing the
      # APK the android workflow builds.
      - name: Self test
        run: ./godot --headless --path . --script res://tools/selftest_cli.gd

      - name: Balance diagnostics
        run: ./godot --headless --path . --script res://tools/diagnose.gd

      # Scores the reference layouts against each other. It is printed rather
      # than asserted: the numbers move whenever the economy is touched, and
      # what matters is that somebody reads them when they do.
      - name: Layout scoreboard
        run: ./godot --headless --path . --script res://tools/layout_lab.gd

      # Where a player would feel value, and what paying is actually worth
      # against not paying. Printed for the same reason as the scoreboard:
      # the parity ratio is asserted in tests/test_store.gd, but the numbers
      # behind it should be in front of whoever changes the economy.
      - name: Monetization measurements
        run: ./godot --headless --path . --script res://tools/money_lab.gd

      # Regenerates store/data-safety.md from the code's own allowlists and
      # reports every Play submission requirement as done, manual or unknown.
      # The git check is the point: if the generated form no longer matches
      # the code, somebody changed what the app collects without changing what
      # the store page says it collects.
      - name: Play readiness
        run: |
          ./godot --headless --path . --script res://tools/play_readiness.gd \
            | tee play-readiness.txt
          git diff --exit-code -- store/data-safety.md

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-readiness
          path: play-readiness.txt

  screenshots:
    name: screenshots render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: ./godot --headless --path . --import
      # Rendering the store screenshots from the running game is also the only
      # automated check that the UI still draws at all.
      - name: Render
        run: |
          xvfb-run -a ./godot --path . --resolution 720x1440 \
            --rendering-driver opengl3 tools/shots.tscn
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ~/.local/share/godot/app_userdata/Lodeworks/shots/

  smoke:
    name: ui smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: ./godot --headless --path . --import
      # The unit tests never build a Control, so a UI that fails to
      # instantiate passes all of them. This boots the real game, opens the
      # settings panel and the device self test, and checks that what came up
      # is not a black rectangle.
      - name: Boot the game and open the self test
        run: |
          xvfb-run -a ./godot --path . --resolution 720x1440 \
            --rendering-driver opengl3 tools/smoke.tscn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: ~/.local/share/godot/app_userdata/Lodeworks/smoke/
          if-no-files-found: warn
