<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lodeworks. The icon is the game: a four-tile corner of a board with a
       hot machine, a cold one, and the heat bleeding between them. Drawn
       rather than painted, for the same reason the game is. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a212b"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2703a"/>
      <stop offset="1" stop-color="#a33a1f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- heat bloom under the hot tile -->
  <rect x="150" y="150" width="212" height="212" rx="28" fill="#6b3a22" opacity="0.55"/>

  <!-- top-left: drill (cool) -->
  <rect x="104" y="104" width="136" height="136" rx="22" fill="#6e8ba8"/>
  <path d="M148 146 h48 l-24 44 z" fill="#0e1116"/>

  <!-- top-right: boiler (hot) -->
  <rect x="272" y="104" width="136" height="136" rx="22" fill="url(#heat)"/>
  <path d="M300 168 q20 -20 40 0 t40 0" stroke="#0e1116" stroke-width="13"
        fill="none" stroke-linecap="round"/>
  <path d="M300 196 q20 -20 40 0 t40 0" stroke="#0e1116" stroke-width="13"
        fill="none" stroke-linecap="round"/>

  <!-- bottom-left: coolant (cold) -->
  <rect x="104" y="272" width="136" height="136" rx="22" fill="#4fc3f7"/>
  <g stroke="#0e1116" stroke-width="14" stroke-linecap="round">
    <path d="M172 306 v72"/>
    <path d="M141 322 l62 36"/>
    <path d="M203 322 l-62 36"/>
  </g>

  <!-- bottom-right: vault (sells) -->
  <rect x="272" y="272" width="136" height="136" rx="22" fill="#5ddba0"/>
  <circle cx="340" cy="340" r="42" fill="none" stroke="#0e1116" stroke-width="14"/>
  <circle cx="340" cy="340" r="15" fill="#0e1116"/>

  <!-- efficiency bars: the readout the whole game is played off -->
  <g opacity="0.95">
    <rect x="120" y="222" width="104" height="9" rx="4" fill="#5ddba0"/>
    <rect x="288" y="222" width="104" height="9" rx="4" fill="#ffb454"/>
    <rect x="120" y="390" width="104" height="9" rx="4" fill="#5ddba0"/>
    <rect x="288" y="390" width="72" height="9" rx="4" fill="#5ddba0"/>
  </g>
</svg>
