; A second preset that produces an APK rather than an AAB.
;
; Play only accepts the AAB, but an AAB cannot be installed on a phone. This
; one exists so CI can hand out something sideloadable: `adb install` it, or
; open it from a file manager, and the device self test in the settings screen
; becomes reachable without a Play account, a release key or a review queue.
; Same code, same filters, same target SDK -- only the container differs.

[preset.1]

name="Android APK"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/art/layout.json, locale/*.po"
exclude_filter="tools/*, tests/*, store/*, docs/*, slice/*, art_src/*"
export_path="build/lodeworks.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

