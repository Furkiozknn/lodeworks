; Android export preset.
;
; Committed WITHOUT keystore paths or passwords -- Godot stores those in plain
; text in this file, so the release signing block is left empty here and filled
; from environment variables by tools/build-android.sh. Never commit a filled-in
; copy of this file.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/art/layout.json, locale/*.po"
exclude_filter="tools/*, tests/*, store/*, docs/*, slice/*, art_src/*"
export_path="build/lodeworks.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

